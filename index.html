<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Re1th — Coming Soon</title>
  <meta name="description" content="Portfolio coming soon.">
  <style>
    :root {
      --bg: #fafafa;
      --fg: #111;
      --muted: #666;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e0e10;
        --fg: #f2f2f2;
        --muted: #8a8a8f;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 16px;
      text-align: center;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    p {
      margin-top: 0.75rem;
      color: var(--muted);
      font-size: 1.125rem;
    }
    footer {
      position: fixed;
      bottom: 16px;
      left: 0;
      right: 0;
      color: var(--muted);
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Coming soon</h1>
    <p>My portfolio is under construction. Check back later.</p>
  </main>
  <footer>&copy; <span id="year">2026</span> Re1th</footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
